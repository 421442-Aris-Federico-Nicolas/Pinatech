name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate production configuration with placeholders
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          digest="$(printf '0%.0s' {1..64})"
          env_file="$tmp_dir/production.env"
          {
            echo "APP_DOMAIN=store.example.com"
            echo "ACME_EMAIL=ops@example.com"
            echo "CADDY_IMAGE=example.invalid/caddy"
            echo "CADDY_IMAGE_DIGEST=$digest"
            echo "FRONTEND_IMAGE=example.invalid/frontend"
            echo "FRONTEND_IMAGE_DIGEST=$digest"
            echo "BACKEND_IMAGE=example.invalid/backend"
            echo "BACKEND_IMAGE_DIGEST=$digest"
            echo "POSTGRES_IMAGE=example.invalid/postgres"
            echo "POSTGRES_IMAGE_DIGEST=$digest"
            echo "POSTGRES_DB=pinatech"
            echo "POSTGRES_USER=pinatech_app"
            echo "POSTGRES_PASSWORD=ci-placeholder-not-a-secret"
            echo "JWT_SECRET=ci-placeholder-with-more-than-thirty-two-bytes"
            echo "MP_ENABLED=false"
          } > "$env_file"
          docker compose --env-file "$env_file" -f docker-compose.prod.yml config --quiet
          docker run --rm \
            -e APP_DOMAIN=store.example.com \
            -e ACME_EMAIL=ops@example.com \
            -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode clean verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --watch=false
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag pinatech-backend:ci ./backend
      - run: docker build --tag pinatech-frontend:ci ./frontend
      - name: Validate hardened Nginx runtime configuration
        run: >-
          docker run --rm --user 101:101 --read-only
          --security-opt no-new-privileges=true --cap-drop ALL
          --cap-add NET_BIND_SERVICE
          --tmpfs /var/cache/nginx:uid=101,gid=101,mode=0750
          --tmpfs /var/run:uid=101,gid=101,mode=0750
          --tmpfs /tmp:uid=101,gid=101,mode=0700
          pinatech-frontend:ci nginx -t
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pinatech-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pinatech-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
