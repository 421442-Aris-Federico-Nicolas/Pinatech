name: pinatech-dev

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-computer_store}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-computer_store}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-computer_store}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computer-store-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - dev_media_uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DEV_POSTGRES_DB:-computer_store}
      SPRING_DATASOURCE_USERNAME: ${DEV_POSTGRES_USER:-computer_store}
      SPRING_DATASOURCE_PASSWORD: ${DEV_POSTGRES_PASSWORD:-computer_store}
      CORS_ALLOWED_ORIGIN: http://localhost:${DEV_FRONTEND_PORT:-4200}
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*
      JWT_SECRET: ${DEV_JWT_SECRET:-local-development-secret-change-before-production}
      REFRESH_COOKIE_SECURE: "false"
      MP_ENABLED: "false"
      FILE_STORAGE_ROOT: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - computer-store-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEV_FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computer-store-network

volumes:
  dev_postgres_data:
  dev_media_uploads:

networks:
  computer-store-network:
    driver: bridge
