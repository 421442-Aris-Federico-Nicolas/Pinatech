name: pinatech-dev

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-computer_store}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-computer_store}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-computer_store}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computer-store-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - dev_media_uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DEV_POSTGRES_DB:-computer_store}
      SPRING_DATASOURCE_USERNAME: ${DEV_POSTGRES_USER:-computer_store}
      SPRING_DATASOURCE_PASSWORD: ${DEV_POSTGRES_PASSWORD:-computer_store}
      CORS_ALLOWED_ORIGIN: http://localhost:${DEV_FRONTEND_PORT:-4200},,https://cwg7qphk-80.brs.devtunnels.ms
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,https://*.devtunnels.ms
      JWT_SECRET: ${DEV_JWT_SECRET:-local-development-secret-change-before-production}
      REFRESH_COOKIE_SECURE: "false"
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_MAX_REGISTRATION_ATTEMPTS: ${AUTH_MAX_REGISTRATION_ATTEMPTS:-3}
      AUTH_MAX_REFRESH_ATTEMPTS: ${AUTH_MAX_REFRESH_ATTEMPTS:-20}
      AUTH_MAX_ACCOUNT_ACTION_ATTEMPTS: ${AUTH_MAX_ACCOUNT_ACTION_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-PT24H}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-PT1H}
      EMAIL_CHANGE_TTL: ${EMAIL_CHANGE_TTL:-PT1H}
      STOREFRONT_BASE_URL: http://localhost:${DEV_FRONTEND_PORT:-4200}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_OUTBOX_INTERVAL_MS: ${EMAIL_OUTBOX_INTERVAL_MS:-10000}
      PICKUP_ENABLED: ${PICKUP_ENABLED:-false}
      PICKUP_LOCATION_CODE: ${PICKUP_LOCATION_CODE:-}
      PICKUP_LOCATION_NAME: ${PICKUP_LOCATION_NAME:-}
      PICKUP_ADDRESS_LINES: ${PICKUP_ADDRESS_LINES:-}
      PICKUP_LOCALITY: ${PICKUP_LOCALITY:-}
      PICKUP_PROVINCE_CODE: ${PICKUP_PROVINCE_CODE:-}
      PICKUP_POSTAL_CODE: ${PICKUP_POSTAL_CODE:-}
      PICKUP_INSTRUCTIONS: ${PICKUP_INSTRUCTIONS:-}
      PICKUP_HOURS: ${PICKUP_HOURS:-}
      BANK_TRANSFER_ENABLED: ${BANK_TRANSFER_ENABLED:-false}
      BANK_TRANSFER_HOLDER: ${BANK_TRANSFER_HOLDER:-}
      BANK_TRANSFER_TAX_ID: ${BANK_TRANSFER_TAX_ID:-}
      BANK_TRANSFER_BANK_NAME: ${BANK_TRANSFER_BANK_NAME:-}
      BANK_TRANSFER_ALIAS: ${BANK_TRANSFER_ALIAS:-}
      BANK_TRANSFER_CBU: ${BANK_TRANSFER_CBU:-}
      BANK_TRANSFER_CURRENCY: ${BANK_TRANSFER_CURRENCY:-ARS}
      BANK_TRANSFER_PROOF_TTL: ${BANK_TRANSFER_PROOF_TTL:-PT24H}
      MP_ENABLED: "false"
      FILE_STORAGE_ROOT: /app/uploads
      PRIVATE_DOCUMENTS_SUBROOT: ${PRIVATE_DOCUMENTS_SUBROOT:-bank-transfer-proofs}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - computer-store-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEV_FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - computer-store-network

volumes:
  dev_postgres_data:
  dev_media_uploads:

networks:
  computer-store-network:
    driver: bridge
