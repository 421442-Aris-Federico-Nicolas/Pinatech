spring:
  application:
    name: computer-store-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 52MB
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

app:
  storage:
    root: ${FILE_STORAGE_ROOT:./uploads}
    private-documents-subroot: ${PRIVATE_DOCUMENTS_SUBROOT:bank-transfer-proofs}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.devtunnels.ms}"
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cookies:
    secure: ${REFRESH_COOKIE_SECURE:false}
  auth-rate-limit:
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    max-registration-attempts: ${AUTH_MAX_REGISTRATION_ATTEMPTS:3}
    max-refresh-attempts: ${AUTH_MAX_REFRESH_ATTEMPTS:20}
    max-account-action-attempts: ${AUTH_MAX_ACCOUNT_ACTION_ATTEMPTS:5}
    window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}
  account-tokens:
    email-verification-ttl: ${EMAIL_VERIFICATION_TTL:PT24H}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT1H}
    email-change-ttl: ${EMAIL_CHANGE_TTL:PT1H}
  storefront:
    base-url: ${STOREFRONT_BASE_URL:http://localhost:4200}
  email:
    logo-url: ${EMAIL_LOGO_URL:}
    seller-recipient: ${SELLER_NOTIFICATION_EMAIL:}
    outbox-interval-ms: ${EMAIL_OUTBOX_INTERVAL_MS:10000}
    resend:
      enabled: ${RESEND_ENABLED:false}
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}
  orders:
    reservation-ttl: ${ORDER_RESERVATION_TTL:PT15M}
    expiration-batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
    expiration-check-interval-ms: ${ORDER_EXPIRATION_CHECK_INTERVAL_MS:60000}
  fulfillment:
    pickup:
      enabled: ${PICKUP_ENABLED:false}
      code: ${PICKUP_LOCATION_CODE:}
      name: ${PICKUP_LOCATION_NAME:}
      address-lines: ${PICKUP_ADDRESS_LINES:}
      locality: ${PICKUP_LOCALITY:}
      province-code: ${PICKUP_PROVINCE_CODE:}
      postal-code: ${PICKUP_POSTAL_CODE:}
      instructions: ${PICKUP_INSTRUCTIONS:}
      hours: ${PICKUP_HOURS:}
  payments:
    bank-transfer:
      enabled: ${BANK_TRANSFER_ENABLED:false}
      holder: ${BANK_TRANSFER_HOLDER:}
      tax-id: ${BANK_TRANSFER_TAX_ID:}
      bank-name: ${BANK_TRANSFER_BANK_NAME:}
      alias: ${BANK_TRANSFER_ALIAS:}
      cbu: ${BANK_TRANSFER_CBU:}
      currency: ${BANK_TRANSFER_CURRENCY:ARS}
      proof-ttl: ${BANK_TRANSFER_PROOF_TTL:PT24H}
      retention-interval-ms: ${BANK_TRANSFER_RETENTION_INTERVAL_MS:3600000}
      orphan-interval-ms: ${BANK_TRANSFER_ORPHAN_INTERVAL_MS:86400000}
    mercado-pago:
      enabled: ${MP_ENABLED:false}
      environment: ${MP_ENVIRONMENT:sandbox}
      access-token: ${MP_ACCESS_TOKEN:}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      collector-id: ${MP_COLLECTOR_ID:}
      storefront-base-url: ${MP_STOREFRONT_BASE_URL:${PUBLIC_BASE_URL:}}
      webhook-base-url: ${MP_WEBHOOK_BASE_URL:${PUBLIC_BASE_URL:}}
      connect-timeout: ${MP_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${MP_READ_TIMEOUT:PT10S}
      production-confirmation: ${MP_PRODUCTION_CONFIRMATION:false}
      webhook-timestamp-tolerance: ${MP_WEBHOOK_TIMESTAMP_TOLERANCE:PT5M}
      reconciliation-lookback: ${MP_RECONCILIATION_LOOKBACK:PT720H}
      refund-reconciliation-interval-ms: ${MP_REFUND_RECONCILIATION_INTERVAL_MS:60000}
