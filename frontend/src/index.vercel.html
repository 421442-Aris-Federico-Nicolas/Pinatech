<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <title>Pinatech | Tecnología y hardware</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Catálogo de hardware y tecnología de Pinatech.">
  <meta name="theme-color" content="#041f34">
  <link rel="preconnect" href="https://api.pinatech.com.ar">
  <link rel="dns-prefetch" href="https://api.pinatech.com.ar">
  <script>
    if (window.location.pathname === '/') {
      const heroPreloads = [
        {
          media: '(max-width: 620px)',
          href: 'https://api.pinatech.com.ar/api/home/hero/current/MOBILE/720.webp',
        },
        {
          media: '(min-width: 621px)',
          href: 'https://api.pinatech.com.ar/api/home/hero/current/DESKTOP/1920.webp',
        },
      ];
      for (const source of heroPreloads) {
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.type = 'image/webp';
        preload.fetchPriority = 'high';
        preload.media = source.media;
        preload.href = source.href;
        document.head.append(preload);
      }
    }
  </script>
  <link rel="icon" type="image/png" sizes="256x256" href="pinatech-favicon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
