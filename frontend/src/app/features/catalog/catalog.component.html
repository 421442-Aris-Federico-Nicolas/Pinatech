<main><h1>Catálogo</h1><div class="search"><input [(ngModel)]="search" (keyup.enter)="load()" placeholder="Buscar productos"><button mat-flat-button (click)="load()">Buscar</button></div><section class="grid">@for (product of page()?.content ?? []; track product.id) { <mat-card><mat-card-header><mat-card-title>{{ product.name }}</mat-card-title><mat-card-subtitle>{{ product.brandName }} · {{ product.categoryName }}</mat-card-subtitle></mat-card-header><mat-card-content><p>{{ product.description }}</p><strong>{{ product.price | number:'1.2-2' }} ARS</strong></mat-card-content><mat-card-actions><button mat-button (click)="cart.add(product)">Agregar al carrito</button></mat-card-actions></mat-card> }</section>@if(page();as result){<footer><button mat-button [disabled]="result.number===0" (click)="load(result.number-1)">Anterior</button><span>{{ result.number+1 }} / {{ result.totalPages }}</span><button mat-button [disabled]="result.number+1>=result.totalPages" (click)="load(result.number+1)">Siguiente</button></footer>}</main>
