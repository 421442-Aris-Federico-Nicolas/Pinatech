<section class="success-state" role="status" aria-live="polite" aria-atomic="true">
  <img class="success-image" src="/pinatech-success-sale.png" alt="" width="1254" height="1254" aria-hidden="true">

  <div class="copy">
    <span class="check" aria-hidden="true">✓</span>

    }
