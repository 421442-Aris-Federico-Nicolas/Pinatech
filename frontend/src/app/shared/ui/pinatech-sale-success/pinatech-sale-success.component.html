<section class="success-state" role="status" aria-live="polite" aria-atomic="true">
  <div class="celebration" [class.is-ready]="spriteReady()" aria-hidden="true">
    <img #spritePreload class="sprite-preload" src="/pinatech-success-sale-sprite.png" alt="" width="2176" height="398" (load)="markSpriteReady()">
    <i class="confetti"></i><i class="confetti"></i>
    <i class="confetti"></i><i class="confetti"></i>
    <i class="confetti"></i><i class="confetti"></i>
    <i class="confetti"></i><i class="confetti"></i>

    <span class="spark spark--left">✦</span>
    <span class="spark spark--right">✦</span>
    <div class="mascot"></div>
    <span class="mascot-shadow"></span>
  </div>

  <div class="copy">
    <span class="check" aria-hidden="true">✓</span>
    <h1>{{ title() }}</h1>
    <p>{{ message() }}</p>

    @if (orderNumber() !== null) {
      <span class="order-number">Pedido #{{ orderNumber() }}</span>
    }
  </div>

  <ng-content />
</section>
