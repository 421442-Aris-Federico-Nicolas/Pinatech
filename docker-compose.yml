services:
  backend:
    build:
      context: ./backend
    container_name: computer-store-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - media_uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_COOKIE_SECURE: "true"
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_MAX_REGISTRATION_ATTEMPTS: ${AUTH_MAX_REGISTRATION_ATTEMPTS:-3}
      AUTH_MAX_REFRESH_ATTEMPTS: ${AUTH_MAX_REFRESH_ATTEMPTS:-20}
      AUTH_MAX_ACCOUNT_ACTION_ATTEMPTS: ${AUTH_MAX_ACCOUNT_ACTION_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-PT24H}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-PT1H}
      EMAIL_CHANGE_TTL: ${EMAIL_CHANGE_TTL:-PT1H}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:4200}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ORDER_RESERVATION_TTL: ${ORDER_RESERVATION_TTL:-PT15M}
      ORDER_EXPIRATION_BATCH_SIZE: ${ORDER_EXPIRATION_BATCH_SIZE:-100}
      ORDER_EXPIRATION_CHECK_INTERVAL_MS: ${ORDER_EXPIRATION_CHECK_INTERVAL_MS:-60000}
      PICKUP_ENABLED: ${PICKUP_ENABLED:-false}
      PICKUP_LOCATION_CODE: ${PICKUP_LOCATION_CODE:-}
      PICKUP_LOCATION_NAME: ${PICKUP_LOCATION_NAME:-}
      PICKUP_ADDRESS_LINES: ${PICKUP_ADDRESS_LINES:-}
      PICKUP_LOCALITY: ${PICKUP_LOCALITY:-}
      PICKUP_PROVINCE_CODE: ${PICKUP_PROVINCE_CODE:-}
      PICKUP_POSTAL_CODE: ${PICKUP_POSTAL_CODE:-}
      PICKUP_INSTRUCTIONS: ${PICKUP_INSTRUCTIONS:-}
      PICKUP_HOURS: ${PICKUP_HOURS:-}
      MP_ENABLED: ${MP_ENABLED:-false}
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-sandbox}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_COLLECTOR_ID: ${MP_COLLECTOR_ID:-}
      MP_STOREFRONT_BASE_URL: ${MP_STOREFRONT_BASE_URL:-${PUBLIC_BASE_URL:-}}
      MP_WEBHOOK_BASE_URL: ${MP_WEBHOOK_BASE_URL:-${PUBLIC_BASE_URL:-}}
      MP_CONNECT_TIMEOUT: ${MP_CONNECT_TIMEOUT:-PT3S}
      MP_READ_TIMEOUT: ${MP_READ_TIMEOUT:-PT10S}
      MP_PRODUCTION_CONFIRMATION: ${MP_PRODUCTION_CONFIRMATION:-false}
      MP_WEBHOOK_TIMESTAMP_TOLERANCE: ${MP_WEBHOOK_TIMESTAMP_TOLERANCE:-PT5M}
      MP_RECONCILIATION_LOOKBACK: ${MP_RECONCILIATION_LOOKBACK:-PT720H}
      MP_REFUND_RECONCILIATION_INTERVAL_MS: ${MP_REFUND_RECONCILIATION_INTERVAL_MS:-60000}
      FILE_STORAGE_ROOT: /app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - computer-store-network

  frontend:
    build:
      context: ./frontend
    container_name: computer-store-frontend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - computer-store-network

volumes:
  media_uploads:

networks:
  computer-store-network:
    driver: bridge
